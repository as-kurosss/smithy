[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smithy"
version = "0.1.0"
description = "Python RPA engine — Robot executor, Windows UIA tools, orchestrator, and HTTP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "as-kurosss" }]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.12",
    "fastapi>=0.115",
    "uvicorn>=0.36",
]

[project.optional-dependencies]
windows = ["uiautomation>=2.0.29"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.18",
]

[project.scripts]
smithy = "smithy.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smithy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["TC001"]

[tool.ruff.lint.per-file-ignores]
"src/smithy/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.14"
strict = true

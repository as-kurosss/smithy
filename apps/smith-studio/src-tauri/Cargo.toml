[package]
name = "smith-studio"
version = "0.1.0"
description = "Smith RPA Studio — visual robot editor and runner"
edition = "2024"
license = "MIT"
repository = "https://github.com/as-kurosss/smithy.git"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tauri-plugin-dialog = "2.7.2"
